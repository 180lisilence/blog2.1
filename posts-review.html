<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快速审核 · 我的博客</title>
<meta name="description" content="待审核文章队列，一键通过或驳回。">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/assets/css/blog.css">
<link rel="stylesheet" href="/assets/css/posts-ui.css">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="/" class="brand"><span class="dot"></span>我的博客</a>
    <nav class="nav-links">
      <a href="/">首页</a>
      <a href="/write">写文章</a>
      <a href="/review" class="active">快速审核</a>
    </nav>
  </div>
</header>

<main class="pu-wrap">

  <section class="pu-card pu-hero">
    <h1>快速审核</h1>
    <p>命中敏感词的文章会进入这里。确认内容合规后一键通过发布；不合规则驳回并填写理由。</p>
    <div class="pu-who">
      <span id="reviewStats">正在加载统计…</span>
      <button class="pu-btn ghost small" id="refreshBtn" type="button">刷新队列</button>
    </div>
  </section>

  <div id="reviewToast" class="pu-result" hidden></div>

  <section id="reviewList"></section>

</main>

<footer class="site-footer">
  <p>© 2026 我的博客 · 所有数据本地存储 · 不追踪、不收集</p>
</footer>

<script src="/assets/js/posts-review.js" defer></script>
<script src="/assets/js/nav-mobile.js" defer></script>
</body>
</html>

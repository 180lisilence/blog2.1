<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目中心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f7fa 0%, #eef1f7 100%);
    }
    header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,.1);
    }
    header .title { display: flex; align-items: center; gap: 12px; }
    header .logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 18px;
    }
    header h1 { font-size: 20px; }
    header .user { font-size: 14px; opacity: .9; }
    .logout {
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.4);
      color: #fff; padding: 8px 18px; border-radius: 10px;
      cursor: pointer; font-size: 14px;
      transition: background .2s;
    }
    .logout:hover { background: rgba(255,255,255,.3); }

    /* 下拉导航栏 */
    .nav-dropdown { position: relative; }
    .nav-btn {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.3);
      color: #fff; padding: 8px 16px; border-radius: 10px;
      cursor: pointer; font-size: 14px; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
      transition: background .2s;
    }
    .nav-btn:hover { background: rgba(255,255,255,.25); }
    .nav-panel {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 280px;
      max-height: 400px;
      overflow-y: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,.15);
      padding: 8px;
      z-index: 200;
    }
    .nav-panel.show { display: block; }
    .nav-search {
      width: 100%; padding: 8px 12px; border: 1px solid #e5e7eb;
      border-radius: 8px; font-size: 13px; margin-bottom: 8px;
      outline: none;
    }
    .nav-search:focus { border-color: #667eea; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
      cursor: pointer; text-decoration: none; color: #1f2937;
      font-size: 13px; transition: background .15s;
    }
    .nav-item:hover { background: #f3f4f6; }
    .nav-item .nav-icon { font-size: 18px; width: 24px; text-align: center; }
    .nav-item .nav-name { flex: 1; font-weight: 500; }
    .nav-section {
      font-size: 11px; color: #9ca3af; font-weight: 700;
      padding: 8px 10px 4px; text-transform: uppercase; letter-spacing: .5px;
    }

    main { max-width: 1080px; margin: 32px auto; padding: 0 24px; }
    .welcome { margin-bottom: 22px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; }
    .welcome h2 { font-size: 22px; color: #1f2937; margin-bottom: 6px; }
    .welcome p { color: #6b7280; font-size: 14px; }
    .welcome .count { color: #667eea; font-weight: 600; font-size: 14px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,.06);
      border: 1px solid #eef0f5;
      transition: transform .15s, box-shadow .15s;
      text-decoration: none;
      display: block;
      color: inherit;
      position: relative;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,.1); }
    .card .c-icon {
      width: 46px; height: 46px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; margin-bottom: 14px;
    }
    .card h3 { font-size: 17px; color: #1f2937; margin-bottom: 6px; padding-right: 24px; }
    .card p { font-size: 13px; color: #6b7280; line-height: 1.6; }
    .card .go { margin-top: 12px; font-size: 13px; color: #667eea; font-weight: 600; }
    .card .tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .card .tag { font-size: 11px; padding: 2px 8px; background: #f3f4f6; color: #6b7280; border-radius: 10px; }
    .card .del-btn {
      position: absolute; top: 16px; right: 16px;
      width: 24px; height: 24px; border-radius: 6px;
      border: none; background: transparent; color: #d1d5db;
      cursor: pointer; font-size: 16px; display: flex;
      align-items: center; justify-content: center;
      transition: all .2s;
    }
    .card .del-btn:hover { background: #fef2f2; color: #ef4444; }

    /* 分区标题与外链作品卡 */
    .section-label {
      grid-column: 1 / -1;
      display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
      margin: 10px 0 -2px;
      font-size: 15px; font-weight: 600; color: #1f2937;
    }
    .section-label .sub { font-size: 12px; font-weight: 400; color: #9ca3af; }
    .card.ext-card { border-style: dashed; border-color: #dbe2ef; }
    .card.ext-card:hover { border-color: #667eea; }
    .card .ext-badge {
      position: absolute; top: 14px; right: 14px;
      font-size: 12px; color: #667eea; background: #eef2ff;
      border-radius: 8px; padding: 2px 7px; line-height: 1.4;
    }
    .card.ext-card .go { color: #0f766e; }
    .card .meta { margin-top: 8px; font-size: 11px; color: #9ca3af; }
    .nav-ext { color: #667eea; font-size: 11px; }

    /* 加号导入卡片 */
    .card.add-card {
      border: 2px dashed #d1d5db;
      background: rgba(255,255,255,.5);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 180px; cursor: pointer;
      transition: all .2s;
    }
    .card.add-card:hover { border-color: #667eea; background: rgba(102,126,234,.05); transform: translateY(-3px); }
    .card.add-card .plus { font-size: 40px; color: #9ca3af; margin-bottom: 8px; transition: color .2s; }
    .card.add-card:hover .plus { color: #667eea; }
    .card.add-card .add-text { font-size: 14px; color: #6b7280; font-weight: 500; }

    .c1 { background: #eef2ff; } .c2 { background: #ecfdf5; } .c3 { background: #fff7ed; }
    .c4 { background: #fef2f2; } .c5 { background: #eff6ff; } .c6 { background: #faf5ff; }

    .loading, .error {
      text-align: center; color: #6b7280; padding: 60px 0; font-size: 15px;
    }

    /* 导入对话框 */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #fff; border-radius: 16px; padding: 24px;
      width: 90%; max-width: 520px; max-height: 80vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .modal h3 { font-size: 18px; color: #1f2937; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .modal .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #9ca3af; }
    .modal .close-btn:hover { color: #1f2937; }
    .modal .form-group { margin-bottom: 16px; }
    .modal label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .modal input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
    .modal input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.1); }
    .modal .btn-primary { width: 100%; padding: 11px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .modal .btn-primary:hover { opacity: .9; }
    .modal .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .modal .msg { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
    .modal .msg.error { background: #fef2f2; color: #dc2626; }
    .modal .msg.success { background: #f0fdf4; color: #16a34a; }
    .modal .spec { background: #f9fafb; border-radius: 10px; padding: 14px; margin-bottom: 16px; font-size: 12px; color: #6b7280; line-height: 1.7; }
    .modal .spec code { background: #e5e7eb; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
    .modal .spec-title { font-weight: 700; color: #374151; margin-bottom: 6px; font-size: 13px; }
    .scan-list { margin-top: 12px; }
    .scan-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 8px; }
    .scan-item .scan-icon { font-size: 20px; }
    .scan-item .scan-info { flex: 1; }
    .scan-item .scan-name { font-size: 13px; font-weight: 600; color: #1f2937; }
    .scan-item .scan-folder { font-size: 11px; color: #9ca3af; }
    .scan-item .scan-import { padding: 6px 12px; background: #667eea; color: #fff; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .scan-item .scan-import:disabled { background: #d1d5db; cursor: not-allowed; }
    .scan-empty { text-align: center; color: #9ca3af; font-size: 13px; padding: 20px; }
  </style>
</head>
<body>
<header>
  <div class="title">
    <div class="logo">M</div>
    <h1>项目中心</h1>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <!-- 下拉导航栏 -->
    <div class="nav-dropdown">
      <button class="nav-btn" onclick="toggleNav(event)">🧭 快速导航 ▾</button>
      <div class="nav-panel" id="navPanel">
        <input type="text" class="nav-search" id="navSearch" placeholder="搜索项目..." oninput="filterNav()">
        <div id="navList"></div>
      </div>
    </div>
    <span class="user" id="currentUser"></span>
    <button class="logout" onclick="location.href='/settings.html'" style="background:#f0f0f0;color:#555">⚙️ 设置</button>
    <button class="logout" onclick="doLogout()">退出登录</button>
  </div>
</header>

<main>
  <div class="welcome">
    <div>
      <h2 id="welcomeText">欢迎回来</h2>
      <p>以下项目需要登录后使用，点击即可进入。</p>
    </div>
    <div class="count" id="projectCount"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<!-- 导入对话框 -->
<div class="modal-overlay" id="importModal">
  <div class="modal">
    <h3>
      导入新项目
      <button class="close-btn" onclick="closeModal()">✕</button>
    </h3>

    <div class="spec">
      <div class="spec-title">📋 项目导入规范</div>
      项目文件夹需放在 <code>blog/projects/</code> 下，根目录包含 <code>project.json</code>：<br>
      必填：<code>name</code>（项目名）、<code>entry</code>（入口文件，如 index.html）<br>
      可选：<code>version</code>、<code>description</code>、<code>icon</code>（emoji）、<code>color</code>（c1-c6）、<code>author</code>、<code>tags</code>
    </div>

    <div class="form-group">
      <label>手动输入文件夹名导入</label>
      <input type="text" id="folderInput" placeholder="如：my-project（需放在 blog/projects/ 下）">
    </div>
    <button class="btn-primary" id="importBtn" onclick="doImport()">导入项目</button>
    <div class="msg" id="importMsg" style="display:none"></div>

    <div style="margin-top:20px; border-top: 1px solid #e5e7eb; padding-top: 16px;">
      <label style="margin-bottom:10px;display:block">🔍 扫描可导入的项目（已有 project.json 但未导入）</label>
      <button class="btn-primary" style="background:#6b7280;margin-bottom:12px" onclick="scanProjects()">扫描项目</button>
      <div class="scan-list" id="scanList">
        <div class="scan-empty">点击上方按钮扫描</div>
      </div>
    </div>
  </div>
</div>

<script src="/session-kicked.js"></script>
<script src="/presence-client.js?v=2" defer></script>
<script>
  let allProjects = [];
  let allLinks = [];

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // B1-05：href 插值只允许站内绝对路径或 http(s)，挡住 javascript:/data: 协议
  function safeHref(u) {
    const s = String(u == null ? "" : u).trim();
    if (/^\/(?!\/)/.test(s)) return escapeHtml(s);
    if (/^https?:\/\//i.test(s)) return escapeHtml(s);
    return "#";
  }

  // 外链作品卡：有在线演示优先跳演示站，没有则跳仓库
  function extCardHtml(p) {
    const href = p.demo || p.repo;
    const label = p.demo ? "在线体验 →" : "前往 GitHub →";
    const meta = [p.stack, p.size].filter(Boolean).join(" · ");
    return `
      <a class="card ext-card" href="${safeHref(href)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(p.repo)}">
        <span class="ext-badge">↗</span>
        <div class="c-icon ${escapeHtml(p.color || "c1")}">${escapeHtml(p.icon || "🔗")}</div>
        <h3>${escapeHtml(p.name)}</h3>
        <p>${escapeHtml(p.desc)}</p>
        ${p.tags && p.tags.length ? `<div class="tags">${p.tags.slice(0, 3).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>` : ""}
        ${meta ? `<div class="meta">${escapeHtml(meta)}</div>` : ""}
        <div class="go">${label}</div>
      </a>
    `;
  }

  // R4-03：web_token 已 HttpOnly，前端读不到也不必读。登出由服务端
  // clearCookie 清理，请求体 token 服务端一律忽略（F-03）。
  function getToken() {
    return "";
  }

  // CSRF 工具
  // 内存兜底：cookie 读不到时（Secure cookie 走 http 被丢弃 / 隐私模式拦截 /
  // cookie 已过期但页面还开着）还能用缓存的 token，不至于直接发 null 被 403。
  let csrfTokenCache = null;

  function getCsrfToken() {
    const match = document.cookie.match(/(?:^|; )csrf_token=([^;]+)/);
    if (match) {
      const v = decodeURIComponent(match[1]);
      if (v && v !== "null" && v !== "undefined") {
        csrfTokenCache = v;
        return v;
      }
    }
    return csrfTokenCache;
  }

  // 主动向服务端要 token。GET 接口不走 verifyCsrfToken，响应体直接带 token，
  // 不依赖 document.cookie 是否可读。
  // force=true 时带 ?fresh=1，强制换发新 token，用于失效重试。
  let csrfPromise = null;
  function refreshCsrfToken(force) {
    if (csrfPromise) return csrfPromise;
    const url = "/api/csrf-token" + (force ? "?fresh=1&_t=" + Date.now() : "");
    csrfPromise = fetch(url, { credentials: "same-origin", cache: "no-store" })
      .then(r => r.json())
      .then(d => {
        if (d && d.ok && d.csrfToken) { csrfTokenCache = d.csrfToken; return d.csrfToken; }
        return null;
      })
      .catch(() => null)
      .finally(() => { csrfPromise = null; });
    return csrfPromise;
  }

  async function apiFetch(url, options = {}) {
    const method = (options.method || "GET").toUpperCase();
    if (method === "GET" || method === "HEAD") return fetch(url, options);

    options.credentials = options.credentials || "same-origin";

    let token = getCsrfToken();
    if (!token) token = await refreshCsrfToken();

    options.headers = options.headers || {};
    if (token) options.headers["X-CSRF-Token"] = token;

    let resp = await fetch(url, options);

    // VULN-CONCURRENT-01：被顶号 / 会话被撤销 → 401 KICKED 专用码。
    // 立即弹窗告知「账号已在其他设备登录」，清本地态后回登录页，
    // 避免用户对着一个已经失效的会话继续操作、却只看到笼统的 401。
    if (resp.status === 401 && window.__handleKicked) {
      const kicked = await window.__handleKicked(resp);
      if (kicked) return resp;
    }

    // token 失效时补一个再重试一次，只重试一次防死循环
    if (resp.status === 403) {
      let body = null;
      try { body = await resp.clone().json(); } catch (e) { body = null; }
      if (body && typeof body.msg === "string" && body.msg.indexOf("CSRF") >= 0) {
        const fresh = await refreshCsrfToken(true);
        if (fresh) {
          const retryHeaders = Object.assign({}, options.headers, { "X-CSRF-Token": fresh });
          resp = await fetch(url, Object.assign({}, options, { headers: retryHeaders }));
        }
      }
    }

    return resp;
  }

  async function doLogout() {
    // R4-03：HttpOnly web_token 由服务端 logout 的 clearCookie 清理；
    // 前端只清本地可见的体验/访客标记。
    try { await apiFetch("/api/logout", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }); } catch (e) {}
    document.cookie = "web_auth=; path=/; max-age=0";
    document.cookie = "web_guest=; path=/; max-age=0";
    location.href = "/login.html";
  }

  function renderGrid() {
    const grid = document.querySelector("#grid");
    const extCount = allLinks.length;
    document.getElementById("projectCount").textContent =
      `共 ${allProjects.length} 个站内项目${extCount ? ` · ${extCount} 个外部作品` : ""}`;

    let html = `
      <div class="card add-card" onclick="openModal()">
        <div class="plus">+</div>
        <div class="add-text">导入新项目</div>
      </div>
    `;

    // B1-05：项目名/描述/图标/标签/颜色/id 全部转义；id 与 name 走
    // data-* 属性而非拼进 JS 字符串字面量，彻底消除引号闭合注入。
    html += allProjects.map((p) => `
      <a class="card" href="${safeHref(p.url)}" target="_blank" rel="noopener noreferrer">
        ${!p.builtin ? `<button class="del-btn" data-pid="${escapeHtml(p.id)}" data-pname="${escapeHtml(p.name)}" onclick="event.preventDefault();event.stopPropagation();deleteProject(this.dataset.pid,this.dataset.pname)" title="删除">×</button>` : ''}
        <div class="c-icon ${escapeHtml(p.color || 'c1')}">${escapeHtml(p.icon || '📁')}</div>
        <h3>${escapeHtml(p.name)}</h3>
        <p>${escapeHtml(p.desc || '')}</p>
        ${p.tags && p.tags.length ? `<div class="tags">${p.tags.slice(0,3).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        <div class="go">进入项目 →</div>
      </a>
    `).join("");

    if (extCount) {
      html += `<div class="section-label">外部作品 · 友链<span class="sub">独立仓库托管，点击在新标签打开在线演示或 GitHub</span></div>`;
      html += allLinks.map(extCardHtml).join("");
    }

    grid.innerHTML = html;
  }

  function renderNav() {
    const list = document.getElementById("navList");
    const builtin = allProjects.filter(p => p.builtin);
    const imported = allProjects.filter(p => !p.builtin);

    let html = '';
    if (builtin.length) {
      html += '<div class="nav-section">内置项目</div>';
      html += builtin.map(p => `
        <a class="nav-item" href="${safeHref(p.url)}" target="_blank" rel="noopener noreferrer" onclick="closeNav()">
          <span class="nav-icon">${escapeHtml(p.icon || '📁')}</span>
          <span class="nav-name">${escapeHtml(p.name)}</span>
        </a>
      `).join('');
    }
    if (imported.length) {
      html += '<div class="nav-section">导入项目</div>';
      html += imported.map(p => `
        <a class="nav-item" href="${safeHref(p.url)}" target="_blank" rel="noopener noreferrer" onclick="closeNav()">
          <span class="nav-icon">${escapeHtml(p.icon || '📁')}</span>
          <span class="nav-name">${escapeHtml(p.name)}</span>
        </a>
      `).join('');
    }
    if (allLinks.length) {
      html += '<div class="nav-section">外部作品 <span class="nav-ext">↗</span></div>';
      html += allLinks.map(p => `
        <a class="nav-item" href="${safeHref(p.demo || p.repo)}" target="_blank" rel="noopener noreferrer" onclick="closeNav()">
          <span class="nav-icon">${escapeHtml(p.icon || '🔗')}</span>
          <span class="nav-name">${escapeHtml(p.name)}</span>
        </a>
      `).join('');
    }
    list.innerHTML = html;
  }

  function filterNav() {
    const q = document.getElementById("navSearch").value.toLowerCase();
    document.querySelectorAll(".nav-item").forEach(item => {
      const name = item.querySelector(".nav-name").textContent.toLowerCase();
      item.style.display = name.includes(q) ? "flex" : "none";
    });
  }

  function toggleNav(e) {
    e.stopPropagation();
    document.getElementById("navPanel").classList.toggle("show");
  }
  function closeNav() { document.getElementById("navPanel").classList.remove("show"); }
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".nav-dropdown")) closeNav();
  });

  function openModal() {
    document.getElementById("importModal").classList.add("show");
    document.getElementById("folderInput").value = "";
    document.getElementById("importMsg").style.display = "none";
    document.getElementById("scanList").innerHTML = '<div class="scan-empty">点击上方按钮扫描</div>';
  }
  function closeModal() { document.getElementById("importModal").classList.remove("show"); }
  document.getElementById("importModal").addEventListener("click", (e) => {
    if (e.target.id === "importModal") closeModal();
  });

  function showMsg(el, text, type) {
    el.style.display = "block";
    el.className = "msg " + type;
    el.textContent = text;
  }

  async function doImport() {
    const folder = document.getElementById("folderInput").value.trim();
    const btn = document.getElementById("importBtn");
    const msg = document.getElementById("importMsg");
    if (!folder) { showMsg(msg, "请输入项目文件夹名", "error"); return; }
    btn.disabled = true; btn.textContent = "导入中...";
    try {
      const r = await apiFetch("/api/projects/import", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ folder })
      });
      const d = await r.json();
      if (d.ok) {
        showMsg(msg, d.msg, "success");
        await loadData();
        setTimeout(() => { closeModal(); }, 1000);
      } else {
        let errText = d.msg;
        if (d.errors && d.errors.length) errText += "\n" + d.errors.join("; ");
        showMsg(msg, errText, "error");
      }
    } catch (e) {
      showMsg(msg, "网络错误: " + e.message, "error");
    }
    btn.disabled = false; btn.textContent = "导入项目";
  }

  async function scanProjects() {
    const list = document.getElementById("scanList");
    list.innerHTML = '<div class="scan-empty">扫描中...</div>';
    try {
      const r = await apiFetch("/api/projects/scan");
      const d = await r.json();
      if (d.ok && d.available.length) {
        // B1-05：扫描结果来自磁盘目录名 / project.json，全部当作不可信文本；
        // folder 放进 data-* 属性，不再拼进 onclick 的 JS 字符串字面量。
        list.innerHTML = d.available.map(p => `
          <div class="scan-item">
            <span class="scan-icon">${escapeHtml(p.icon)}</span>
            <div class="scan-info">
              <div class="scan-name">${escapeHtml(p.name)} ${p.valid ? '' : '⚠️ 规范不符'}</div>
              <div class="scan-folder">blog/projects/${escapeHtml(p.folder)}</div>
            </div>
            <button class="scan-import" data-folder="${escapeHtml(p.folder)}" ${p.valid ? '' : 'disabled'} onclick="quickImport(this.dataset.folder, this)">导入</button>
          </div>
        `).join('');
      } else {
        list.innerHTML = '<div class="scan-empty">没有发现可导入的项目</div>';
      }
    } catch (e) {
      list.innerHTML = '<div class="scan-empty">扫描失败</div>';
    }
  }

  async function quickImport(folder, btn) {
    btn.disabled = true; btn.textContent = "...";
    try {
      const r = await apiFetch("/api/projects/import", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ folder })
      });
      const d = await r.json();
      if (d.ok) {
        await loadData();
        btn.textContent = "✓";
        setTimeout(() => { closeModal(); }, 800);
      } else {
        btn.textContent = "失败";
        alert(d.msg + (d.errors ? "\n" + d.errors.join("; ") : ""));
      }
    } catch (e) {
      btn.textContent = "失败";
    }
  }

  async function deleteProject(id, name) {
    if (!confirm(`确定要删除导入的项目「${name}」吗？\n（仅从项目列表移除，不会删除文件夹）`)) return;
    try {
      const r = await apiFetch(`/api/projects/${id}`, { method: "DELETE" });
      const d = await r.json();
      if (d.ok) {
        await loadData();
      } else {
        alert(d.msg);
      }
    } catch (e) {
      alert("删除失败: " + e.message);
    }
  }

  // 站内项目与外链作品并行加载，任一失败都只降级该区块，不白屏
  async function loadData() {
    let projectsOk = false;
    try {
      const r = await apiFetch("/api/projects");
      const d = await r.json();
      if (d && d.ok) {
        allProjects = d.projects || [];
        projectsOk = true;
      }
    } catch (e) {
      console.warn("加载站内项目失败", e);
    }

    try {
      const r = await apiFetch("/api/links");
      const d = await r.json();
      if (d && d.ok) allLinks = d.links || [];
    } catch (e) {
      console.warn("加载外部作品失败", e);
    }

    if (!projectsOk && !allLinks.length) {
      document.querySelector("#grid").innerHTML = '<div class="error">加载项目列表失败</div>';
      return;
    }
    renderGrid();
    renderNav();
  }

  (async () => {
    const main = document.querySelector("main");
    try {
      const r = await apiFetch("/api/me");
      const d = await r.json();
      if (d.ok) {
        document.querySelector("#currentUser").innerText = "当前账号：" + d.username;
        document.querySelector("#welcomeText").innerText = "欢迎回来，" + d.username;
        await loadData();
      } else {
        main.innerHTML = '<div class="error">登录已过期，正在跳转到登录页...</div>';
        setTimeout(() => location.href = "/login.html", 1200);
      }
    } catch (e) {
      main.innerHTML = '<div class="error">无法连接服务，请确认后台服务已启动</div>';
    }
  })();
</script>
</body>
</html>

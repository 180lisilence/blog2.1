<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户设置 - 项目中心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 40px;
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 24px;
    color: #333;
    margin-bottom: 8px;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 32px;
  }
  .user-info {
    background: #f5f7fa;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 24px;
    text-align: center;
  }
  .user-info .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .user-info .name {
    font-size: 16px;
    font-weight: 600;
    color: #333;
  }
  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: #666;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-group {
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
    font-weight: 500;
  }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.2s;
    outline: none;
  }
  input[type="password"]:focus {
    border-color: #667eea;
  }
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
  }
  .btn-secondary {
    background: #f0f0f0;
    color: #555;
    margin-top: 8px;
  }
  .btn-secondary:hover {
    background: #e0e0e0;
  }
  .message {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .message.success {
    background: #e8f5e9;
    color: #2e7d32;
    display: block;
  }
  .message.error {
    background: #ffebee;
    color: #c62828;
    display: block;
  }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #667eea;
    text-decoration: none;
    font-size: 14px;
  }
  .back-link:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="container">
  <h1>⚙️ 用户设置</h1>
  <p class="subtitle">管理你的账号信息</p>

  <div class="user-info">
    <div class="avatar" id="avatar">?</div>
    <div class="name" id="username">加载中...</div>
  </div>

  <div class="section-title">修改密码</div>

  <div class="message" id="message"></div>

  <div class="form-group">
    <label for="oldPassword">旧密码</label>
    <input type="password" id="oldPassword" placeholder="请输入当前密码">
  </div>
  <div class="form-group">
    <label for="newPassword">新密码</label>
    <input type="password" id="newPassword" placeholder="6-32 位新密码">
  </div>
  <div class="form-group">
    <label for="confirmPassword">确认新密码</label>
    <input type="password" id="confirmPassword" placeholder="再次输入新密码">
  </div>

  <button class="btn btn-primary" onclick="changePassword()">确认修改</button>
  <button class="btn btn-secondary" onclick="logout()">退出登录</button>

  <a href="/projects.html" class="back-link">← 返回项目中心</a>
</div>

<script>
// CSRF 工具
// 内存兜底：cookie 读不到时（Secure cookie 走 http 被丢弃 / 隐私模式拦截 /
// cookie 已过期但页面还开着）还能用缓存的 token，不至于直接发 null 被 403。
let csrfTokenCache = null;

function getCsrfToken() {
  const match = document.cookie.match(/(?:^|; )csrf_token=([^;]+)/);
  if (match) {
    const v = decodeURIComponent(match[1]);
    if (v && v !== "null" && v !== "undefined") {
      csrfTokenCache = v;
      return v;
    }
  }
  return csrfTokenCache;
}

// 主动向服务端要 token。GET 接口不走 verifyCsrfToken，响应体直接带 token，
// 不依赖 document.cookie 是否可读。
// force=true 时带 ?fresh=1，强制换发新 token，用于失效重试。
let csrfPromise = null;
function refreshCsrfToken(force) {
  if (csrfPromise) return csrfPromise;
  const url = "/api/csrf-token" + (force ? "?fresh=1&_t=" + Date.now() : "");
  csrfPromise = fetch(url, { credentials: "same-origin", cache: "no-store" })
    .then(r => r.json())
    .then(d => {
      if (d && d.ok && d.csrfToken) { csrfTokenCache = d.csrfToken; return d.csrfToken; }
      return null;
    })
    .catch(() => null)
    .finally(() => { csrfPromise = null; });
  return csrfPromise;
}

async function apiFetch(url, options = {}) {
  const method = (options.method || "GET").toUpperCase();
  if (method === "GET" || method === "HEAD") return fetch(url, options);

  options.credentials = options.credentials || "same-origin";

  let token = getCsrfToken();
  if (!token) token = await refreshCsrfToken();

  options.headers = options.headers || {};
  if (token) options.headers["X-CSRF-Token"] = token;

  let resp = await fetch(url, options);

  // token 失效时补一个再重试一次，只重试一次防死循环
  if (resp.status === 403) {
    let body = null;
    try { body = await resp.clone().json(); } catch (e) { body = null; }
    if (body && typeof body.msg === "string" && body.msg.indexOf("CSRF") >= 0) {
      const fresh = await refreshCsrfToken(true);
      if (fresh) {
        const retryHeaders = Object.assign({}, options.headers, { "X-CSRF-Token": fresh });
        resp = await fetch(url, Object.assign({}, options, { headers: retryHeaders }));
      }
    }
  }

  return resp;
}

// 获取当前登录用户
async function loadUser() {
  try {
    const res = await apiFetch("/api/me", { credentials: "include" });
    const data = await res.json();
    if (data.ok) {
      document.getElementById("username").textContent = data.username;
      document.getElementById("avatar").textContent = data.username.charAt(0).toUpperCase();
    } else {
      window.location.href = "/login.html";
    }
  } catch (e) {
    window.location.href = "/login.html";
  }
}

// 修改密码
async function changePassword() {
  const oldPassword = document.getElementById("oldPassword").value;
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const msgEl = document.getElementById("message");

  msgEl.className = "message";
  msgEl.style.display = "none";

  if (!oldPassword || !newPassword || !confirmPassword) {
    showMessage("请填写所有字段", "error");
    return;
  }
  if (newPassword !== confirmPassword) {
    showMessage("两次输入的新密码不一致", "error");
    return;
  }
  if (newPassword.length < 6 || newPassword.length > 32) {
    showMessage("新密码长度需为 6-32 位", "error");
    return;
  }

  try {
    const res = await apiFetch("/api/change-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ oldPassword, newPassword })
    });
    const data = await res.json();
    if (data.ok) {
      showMessage("密码修改成功，即将跳转到登录页...", "success");
      setTimeout(() => { window.location.href = "/login.html"; }, 1500);
    } else {
      showMessage(data.msg || "修改失败", "error");
    }
  } catch (e) {
    showMessage("网络错误，请稍后重试", "error");
  }
}

// 退出登录
async function logout() {
  try {
    await apiFetch("/api/logout", { method: "POST", credentials: "include" });
  } catch (e) {}
  window.location.href = "/login.html";
}

function showMessage(text, type) {
  const msgEl = document.getElementById("message");
  msgEl.textContent = text;
  msgEl.className = "message " + type;
}

loadUser();
</script>
</body>
</html>

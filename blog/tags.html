<button class="global-sun-btn" id="globalSunBtn" title="切换主题 · 按住可拖动">☀️</button>
<style>
.global-sun-btn{position:fixed;top:16px;right:16px;z-index:999999;width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,200,50,.7);background:linear-gradient(135deg,#ffd700,#ff8c00);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 12px rgba(255,165,0,.5);transition:all .3s;animation:globalSunSpin 6s linear infinite}
.global-sun-btn:hover{transform:scale(1.15) rotate(15deg);box-shadow:0 4px 20px rgba(255,165,0,.8);animation-play-state:paused}
@keyframes globalSunSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.global-sun-btn{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.global-sun-btn.dragging{cursor:grabbing;transition:none!important;animation-play-state:paused!important;box-shadow:0 8px 24px rgba(255,165,0,.85)!important}
</style>
<script>
(function(){
  var btn=document.getElementById("globalSunBtn");
  if(!btn)return;
  var html=document.documentElement;
  function setTheme(t){html.setAttribute("data-theme",t);if(btn)btn.textContent=t==="light"?"🌙":"☀️";}
  var saved=localStorage.getItem("globalTheme");
  if(saved==="light"||saved==="dark"){setTheme(saved);}
  else{setTheme(window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");}
  if(btn)btn.addEventListener("click",function(e){e.stopPropagation();var cur=(html.getAttribute("data-theme")==="light")?"light":"dark";var next=cur==="light"?"dark":"light";setTheme(next);localStorage.setItem("globalTheme",next);});
  var KEY="globalSunPos",x=null,y=null;
  try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(typeof p.x==="number"&&typeof p.y==="number"){x=p.x;y=p.y;}}}catch(e){}
  function clamp(){var w=btn.offsetWidth||42,h=btn.offsetHeight||42;x=Math.max(0,Math.min(x,window.innerWidth-w));y=Math.max(0,Math.min(y,window.innerHeight-h));}
  function render(noAnim){if(x===null||y===null)return;clamp();if(noAnim)btn.style.transition="none";btn.style.left=x+"px";btn.style.top=y+"px";btn.style.right="auto";btn.style.bottom="auto";if(noAnim)requestAnimationFrame(function(){btn.style.transition="";});}
  render(true);
  window.addEventListener("resize",function(){if(x!==null&&y!==null)render(false);});
  var dragging=false,moved=false,sx=0,sy=0,ox=0,oy=0;
  btn.addEventListener("pointerdown",function(e){dragging=true;moved=false;if(btn.setPointerCapture)btn.setPointerCapture(e.pointerId);btn.classList.add("dragging");sx=e.clientX;sy=e.clientY;var r=btn.getBoundingClientRect();ox=r.left;oy=r.top;x=ox;y=oy;});
  btn.addEventListener("pointermove",function(e){if(!dragging)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;x=ox+dx;y=oy+dy;render(false);});
  function end(){if(!dragging)return;dragging=false;btn.classList.remove("dragging");try{localStorage.setItem(KEY,JSON.stringify({x:x,y:y}));}catch(e){}}
  btn.addEventListener("pointerup",end);
  btn.addEventListener("pointercancel",end);
  btn.addEventListener("click",function(e){if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
})();
</script>
